<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación</title>
    <style>
        #pantalla-bienvenida {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background: #f6eae6;
            overflow: hidden;
            cursor: pointer;
        }

        #glitter-canvas, #falling-glitter {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #glitter-canvas { z-index: 15; }
        #falling-glitter { z-index: 10; opacity: 0.75; }

        .solapa { transition: transform 1.3s cubic-bezier(0.77, 0, 0.18, 1); }
        .solapa-izq    { transform-box: fill-box; transform-origin: 0% 50%; }
        .solapa-der    { transform-box: fill-box; transform-origin: 100% 50%; }
        .solapa-top    { transform-box: fill-box; transform-origin: 50% 0%; }
        .solapa-bottom { transform-box: fill-box; transform-origin: 50% 100%; }

        #pantalla-bienvenida.abriendo .solapa-izq    { transform: translateX(-120%); }
        #pantalla-bienvenida.abriendo .solapa-der    { transform: translateX(120%); }
        #pantalla-bienvenida.abriendo .solapa-top    { transform: translateY(-120%); }
        #pantalla-bienvenida.abriendo .solapa-bottom { transform: translateY(120%); }

        #pantalla-bienvenida.oculto { display: none; }

        #sello-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(55vw, 260px);
            height: min(55vw, 260px);
            z-index: 20;
            cursor: pointer;
            transition: transform 0.6s ease, opacity 0.6s ease;
            animation: sello-breathe 3s ease-in-out infinite;
        }
        @keyframes sello-breathe {
            0%,100% { transform: translate(-50%,-50%) scale(1); filter: drop-shadow(0 0 18px rgba(244, 195, 195, 0.7)); }
            50%     { transform: translate(-50%,-50%) scale(1.05); filter: drop-shadow(0 0 38px rgba(244, 195, 195, 0.95)); }
        }

        #hint-bienvenida {
            position: absolute;
            bottom: 48px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 0.9rem;
            color: rgba(180,80,90,0.8);
            letter-spacing: 3px;
            z-index: 35;
            animation: hint-pulso 1.8s infinite;
        }
        @keyframes hint-pulso {
            0%,100% { opacity: 0.4; }
            50%     { opacity: 1; }
        }

        #invitacion{
            width:100%;
            background: url('y.png') center/cover no-repeat fixed;
            background-color: #f9e8e8;
            position: relative;
            overflow: hidden;
        }

        .pagina{
            display:block;
            width:100%;
            max-width:900px;
            margin:0 auto;
            height:auto;
        }

        :root {
            --cream: #f9e8e8;
            --pink: #F4C3C3;
            --pink-dark: #e89a9a;
        }

        .gift-section {
            background: var(--cream);
            padding: 70px 20px 50px;
            text-align: center;
            position: relative;
            border: 3px solid var(--pink);
            border-radius: 20px;
            margin: 40px auto;
            max-width: 520px;
            box-shadow: 0 20px 40px rgba(244, 195, 195, 0.4),
                        inset 0 0 60px rgba(248, 213, 213, 0.6);
        }

        h2.sugerencia {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: clamp(22px, 4vw, 32px);
            color: var(--pink-dark);
            margin-bottom: 30px;
            text-shadow: 0 2px 8px rgba(244, 195, 195, 0.5);
        }

        /* Sobre cuadrado rosa */
        .envelope-body {
            width: 160px;
            height: 160px;
            position: relative;
            filter: drop-shadow(0 15px 35px rgba(244, 195, 195, 0.7));
            transition: transform 0.4s ease;
        }
        .envelope-body:hover { transform: scale(1.08) rotate(2deg); }

        /* resto de estilos del sobre (igual que antes) */
        .ribbon-h, .ribbon-v, .bow, .envelope-flap, .envelope-front, .envelope-seal, .envelope-hint, .gift-message {
            /* mantengo los mismos estilos de la versión anterior */
        }
        /* ... (mantengo todo el CSS del sobre sin cambios para no alargar) ... */
    </style>
</head>
<body>

<div id="pantalla-bienvenida">
    <canvas id="glitter-canvas"></canvas>
    <!-- SVG del sobre rosa (igual que antes) -->
    <svg id="sobre-svg" viewBox="0 0 400 711" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- ... mismo SVG rosa ... -->
        <defs>
            <linearGradient id="gIzq" x1="0" y1="0.5" x2="1" y2="0.5">
                <stop offset="0%" stop-color="#f4c3c3"/>
                <stop offset="100%" stop-color="#f8d5d5"/>
            </linearGradient>
            <linearGradient id="gDer" x1="1" y1="0.5" x2="0" y2="0.5">
                <stop offset="0%" stop-color="#e89a9a"/>
                <stop offset="100%" stop-color="#f4b4b4"/>
            </linearGradient>
            <linearGradient id="gTop" x1="0.5" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stop-color="#ffe0e0"/>
                <stop offset="100%" stop-color="#f8d5d5"/>
            </linearGradient>
            <linearGradient id="gBot" x1="0.5" y1="1" x2="0.5" y2="0">
                <stop offset="0%" stop-color="#e89a9a"/>
                <stop offset="100%" stop-color="#f4c3c3"/>
            </linearGradient>
        </defs>
        <!-- Solapas (igual) -->
        <g class="solapa solapa-bottom"><polygon points="0,711 400,711 200,355" fill="url(#gBot)"/></g>
        <g class="solapa solapa-top"><polygon points="0,0 400,0 200,355" fill="url(#gTop)"/></g>
        <g class="solapa solapa-izq"><polygon points="0,0 0,711 200,355" fill="url(#gIzq)"/></g>
        <g class="solapa solapa-der"><polygon points="400,0 400,711 200,355" fill="url(#gDer)"/></g>
    </svg>

    <div id="sello-btn" onclick="abrirSobre()" role="button" aria-label="Abrir invitación">
        <img src="z.png" alt="Sello de lacre"/>
    </div>
    <canvas id="sparks-canvas"></canvas>
    <p id="hint-bienvenida">toca para abrir ✦</p>
</div>

<main id="invitacion">
    <canvas id="falling-glitter"></canvas>

    <img src="1.png" alt="Invitación página 1" class="pagina">
    <img src="2.png" alt="Invitación página 2" class="pagina">
    <img src="3.png" alt="Invitación página 3" class="pagina">
    <img src="4.png" alt="Invitación página 4" class="pagina">
    <img src="5.png" alt="Invitación página 5" class="pagina">
    <img src="6.png" alt="Invitación página 6" class="pagina">
    <img src="7.png" alt="Invitación página 7" class="pagina">

    <section class="gift-section">
        <h2 class="sugerencia">Sugerencia de regalo</h2>
        <div id="envelope-container">
            <button id="envelope-btn" onclick="openEnvelope()">
                <div class="envelope-body">
                    <div class="ribbon-h" id="ribbon-h"></div>
                    <div class="ribbon-v" id="ribbon-v"></div>
                    <div class="bow" id="bow"><div class="bow-center"></div></div>
                    <div class="envelope-flap" id="env-flap"></div>
                    <div class="envelope-front"><div class="envelope-seal">✦</div></div>
                </div>
                <p class="envelope-hint" id="env-hint">Toca el sobre</p>
            </button>
            <div id="envelope-message" class="envelope-message" style="display:none">
                <p class="gift-message">Tu presencia es nuestro mejor regalo.<br>Si deseas hacernos un obsequio,<br><em>agradecemos un sobre.</em></p>
            </div>
        </div>
    </section>

    <img src="9.png" alt="Invitación página 9" class="pagina">
    <img src="10.png" alt="Invitación página 10" class="pagina">
</main>

<script>
(function(){

    // ==================== GLITTER PANTALLA INICIAL (menos brillitos) ====================
    const gc = document.getElementById('glitter-canvas');
    const gx = gc.getContext('2d');
    let stars = [];

    function resizeGlitter() {
        gc.width = window.innerWidth;
        gc.height = window.innerHeight;
        buildStars();
    }

    function buildStars() {
        stars = [];
        const count = Math.max(45, Math.floor((gc.width * gc.height) / 14000)); // ≈ 35-40% menos
        for (let i = 0; i < count; i++) stars.push(newStar(true));
    }

    function newStar(randomPhase) {
        const big = Math.random() < 0.22;
        return {
            x: Math.random() * gc.width,
            y: Math.random() * gc.height,
            size: big ? Math.random() * 10 + 6 : Math.random() * 4.5 + 1.8,
            phase: randomPhase ? Math.random() * Math.PI * 2 : 0,
            speed: Math.random() * 0.028 + 0.011,
            alpha: 0,
            white: Math.random() < 0.78,
            big
        };
    }

    function drawDiamond(ctx, x, y, size, alpha, white) {
        // mismo dibujo bonito de diamante
        const color = white ? `rgba(255,255,255,${alpha})` : `rgba(255,210,220,${alpha})`;
        ctx.save();
        ctx.translate(x, y);
        const grad = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 2.2);
        grad.addColorStop(0, white ? `rgba(255,255,255,${alpha*0.6})` : `rgba(255,200,215,${alpha*0.6})`);
        grad.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(0, 0, size * 2.2, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = color;
        ctx.lineCap = 'round';
        ctx.lineWidth = size * 0.13;
        ctx.beginPath(); ctx.moveTo(0, -size*1.9); ctx.lineTo(0, size*1.9); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-size*1.9, 0); ctx.lineTo(size*1.9, 0); ctx.stroke();

        ctx.restore();
    }

    function animateGlitter() {
        if (!document.getElementById('pantalla-bienvenida').classList.contains('oculto')) {
            gx.clearRect(0, 0, gc.width, gc.height);
            stars.forEach((s, i) => {
                s.phase += s.speed;
                const t = (Math.sin(s.phase) + 1) / 2;
                s.alpha = Math.pow(t, 1.85);
                if (s.alpha > 0.015) drawDiamond(gx, s.x, s.y, s.size, s.alpha * (s.big ? 0.92 : 0.72), s.white);
                if (s.phase > Math.PI * 2) {
                    stars[i] = newStar(false);
                    stars[i].x = Math.random() * gc.width;
                    stars[i].y = Math.random() * gc.height;
                }
            });
        }
        requestAnimationFrame(animateGlitter);
    }

    resizeGlitter();
    animateGlitter();
    window.addEventListener('resize', resizeGlitter);

    // ==================== BRILLITOS CAÍDA EN TODA LA PÁGINA (pocos y destellantes) ====================
    const fg = document.getElementById('falling-glitter');
    const fx = fg.getContext('2d');
    let flakes = [];

    function resizeFalling() {
        fg.width = window.innerWidth;
        fg.height = window.innerHeight;
    }

    function createFlake() {
        return {
            x: Math.random() * fg.width,
            y: Math.random() * fg.height - 100,
            size: Math.random() * 5.5 + 2.2,
            speed: Math.random() * 1.1 + 0.55,
            sway: Math.random() * 1.8 + 0.8,
            phase: Math.random() * Math.PI * 2,
            opacity: Math.random() * 0.65 + 0.45,
            white: Math.random() < 0.75
        };
    }

    function buildFallingGlitter() {
        flakes = [];
        const count = Math.max(35, Math.floor((fg.width * fg.height) / 22000)); // Muy pocos
        for (let i = 0; i < count; i++) flakes.push(createFlake());
    }

    function animateFalling() {
        fx.clearRect(0, 0, fg.width, fg.height);

        flakes.forEach(f => {
            f.y += f.speed;
            f.x += Math.sin(f.phase) * f.sway * 0.04;
            f.phase += 0.035;

            if (f.y > fg.height + 20) f.y = -30;

            const alpha = f.opacity * (0.6 + 0.4 * Math.sin(f.phase * 3));
            fx.fillStyle = f.white ? `rgba(255,255,255,${alpha})` : `rgba(255, 220, 230,${alpha})`;
            fx.beginPath();
            fx.arc(f.x, f.y, f.size, 0, Math.PI * 2);
            fx.fill();

            // pequeño destello
            if (f.size > 3.5) {
                fx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
                fx.beginPath();
                fx.arc(f.x - f.size*0.35, f.y - f.size*0.35, f.size*0.28, 0, Math.PI * 2);
                fx.fill();
            }
        });

        requestAnimationFrame(animateFalling);
    }

    resizeFalling();
    buildFallingGlitter();
    animateFalling();
    window.addEventListener('resize', () => { resizeFalling(); buildFallingGlitter(); });

    // ==================== Resto del código (sparks, abrir sobre, etc.) ====================
    // (Mantengo exactamente la misma funcionalidad que en la versión anterior)

    const sc = document.getElementById('sparks-canvas');
    const sx = sc.getContext('2d');
    let sparks = [];
    let sparksRunning = false;

    // ... (código de burst y animateSparks igual que antes) ...

    // Abrir sobre bienvenida y sobre de regalo (igual)
    window.abrirSobre = function() { /* mismo código */ };
    let envelopeOpened = false;
    window.openEnvelope = function() { /* mismo código */ };

})();
</script>
</body>
</html>
